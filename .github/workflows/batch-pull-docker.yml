name: Batch Pull and Package Docker Images

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Docker镜像列表（每行一个，支持 ghcr.io 等需要认证的仓库）'
        required: true
        type: string
      format:
        description: '打包格式：tar（原始包，默认）或 tar.gz（压缩）'
        required: false
        type: choice
        options:
          - tar
          - tar.gz
        default: tar
      platform:
        description: '--platform 的值，形如 os/arch[/variant]：linux/arm64、windows/amd64、wasip1/wasm…；留空则不传，按运行器平台'
        required: false
        type: string
        default: amd64
      ghcr_login:
        description: '是否登录 ghcr.io（使用 GitHub Token 拉取私有/受限镜像）'
        required: false
        type: boolean
        default: true
      ghcr_username:
        description: 'ghcr.io 用户名（留空则使用 GHCR_USERNAME 密钥，再留空则使用触发工作流的账号）'
        required: false
        type: string
        default: ''
      ghcr_token:
        description: 'GitHub Token（需 read:packages 权限，用于拉取 ghcr.io 私有镜像；留空则使用 GHCR_TOKEN 密钥）'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read

env:
  RELEASE_TAG: docker-images-batch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Enable QEMU for multi-arch
        uses: docker/setup-qemu-action@v2

      - name: Mask provided token
        if: ${{ inputs.ghcr_login && inputs.ghcr_token != '' }}
        env:
          PROVIDED_TOKEN: ${{ inputs.ghcr_token }}
        run: echo "::add-mask::$PROVIDED_TOKEN"

      - name: Report ghcr.io token source
        if: ${{ inputs.ghcr_login }}
        env:
          FROM_INPUT: ${{ inputs.ghcr_token != '' }}
          FROM_SECRET: ${{ secrets.GHCR_TOKEN != '' }}
        run: |
          if [ "$FROM_INPUT" = "true" ]; then
            echo "✅ 使用本次运行输入的 GitHub Token 登录 ghcr.io"
          elif [ "$FROM_SECRET" = "true" ]; then
            echo "✅ 使用仓库密钥 GHCR_TOKEN 登录 ghcr.io（建议使用带 read:packages 权限的 PAT）"
          else
            echo "⚠️ 未提供 Token 且未配置 GHCR_TOKEN，回退到内置的 GITHUB_TOKEN。"
            echo "   内置令牌只能访问本工作流可见的包，跨仓库私有包需要 PAT。"
          fi

      - name: Login to ghcr.io with GitHub Token
        if: ${{ inputs.ghcr_login }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.ghcr_username || secrets.GHCR_USERNAME || github.actor }}
          password: ${{ inputs.ghcr_token || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull and save images
        env:
          IMAGES_RAW: ${{ inputs.images }}
          INPUT_FORMAT: ${{ inputs.format }}
          PLATFORM_INPUT: ${{ inputs.platform }}
          SRC_USER: ${{ inputs.ghcr_username || secrets.GHCR_USERNAME || github.actor }}
          SRC_PASS: ${{ inputs.ghcr_token || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -u

          # 打包格式：workflow_dispatch 的 format 选项，缺省/非法值回退 tar
          case "${INPUT_FORMAT:-}" in
            tar|tar.gz) FORMAT="$INPUT_FORMAT" ;;
            *) FORMAT='tar' ;;
          esac
          echo "Package format: $FORMAT"
          echo "PACK_FORMAT=$FORMAT" >> "$GITHUB_ENV"

          # --platform 的值原样使用，不补前缀、不判断架构（os/arch[/variant]）。
          # 留空则不传 --platform，由 docker/skopeo 按运行器自身平台选择。
          TARGET_PLATFORM="${PLATFORM_INPUT:-}"
          [ "$TARGET_PLATFORM" = 'auto' ] && TARGET_PLATFORM=''
          if [ -n "$TARGET_PLATFORM" ]; then
            echo "Target platform: $TARGET_PLATFORM (显式指定，原样传给 --platform)"
          else
            echo "Target platform: 未指定（不传 --platform，按运行器平台）"
          fi

          # 按需带上 --platform
          pull_image() {
            local ref="$1" plat="${2:-}"
            if [ -n "$plat" ]; then
              docker pull --platform "$plat" "$ref"
            else
              docker pull "$ref"
            fi
          }

          # 去掉注释行、空行、首尾空白和 CRLF，剩下的才是镜像
          IMAGES=$(printf '%s\n' "$IMAGES_RAW" \
            | sed 's/\r$//; s/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | grep -v '^#')

          if [ -z "$IMAGES" ]; then
            echo "❌ 镜像列表为空"
            exit 1
          fi

          # 跨架构/containerd store 下，不带 --platform 的 docker save 会按宿主机平台
          # 找 manifest，而本地只有目标架构的内容 → "content digest ... not found"。
          save_image() {
            local ref="$1" plat="$2" out="$3"
            if [ -n "$plat" ] && docker save --help 2>&1 | grep -q -- '--platform'; then
              docker save --platform "$plat" "$ref" -o "$out" && return 0
              rm -f "$out"
            fi
            docker save "$ref" -o "$out" && return 0
            rm -f "$out"
            return 1
          }

          # 兜底：skopeo 直接从 registry 按架构归档，完全不经过本地镜像存储
          skopeo_archive() {
            local ref="$1" plat="$2" tag="$3" out="$4"
            if ! command -v skopeo >/dev/null 2>&1; then
              echo "  安装 skopeo..."
              sudo apt-get update -qq >/dev/null 2>&1 || true
              sudo apt-get install -y -qq skopeo >/dev/null 2>&1 || { echo "  skopeo 安装失败"; return 1; }
            fi
            # 指定了平台才做 override；没指定就让 skopeo 用自身默认（运行器平台）
            local args=()
            if [ -n "$plat" ]; then
              local os_name='linux' arch variant='' rest
              case "$plat" in
                */*/*) os_name="${plat%%/*}"; rest="${plat#*/}"; arch="${rest%%/*}"; variant="${rest#*/}" ;;
                */*)   os_name="${plat%%/*}"; arch="${plat#*/}" ;;
                *)     arch="$plat" ;;
              esac
              args+=(--override-os "$os_name" --override-arch "$arch")
              [ -n "$variant" ] && args+=(--override-variant "$variant")
            fi
            case "$ref" in
              ghcr.io/*) args+=(--src-creds "${SRC_USER:-x}:${SRC_PASS:-}") ;;
            esac
            echo "  skopeo copy ${args[*]:-（默认平台）}"
            skopeo copy "${args[@]}" "docker://$ref" "docker-archive:$out:$tag"
          }

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            # 允许把 docker 命令片段直接写进列表：`--platform linux/arm64 <image>`。
            # 镜像列表本身只该写镜像名，这里做兼容并把平台解析出来，仅对该行生效。
            image="$line"
            IMAGE_PLATFORM="$TARGET_PLATFORM"
            case "$image" in
              --platform\ *)
                rest="${image#--platform }"
                case "$rest" in
                  *" "*)
                    IMAGE_PLATFORM="${rest%% *}"
                    image="${rest#* }"
                    echo "行内 --platform：$IMAGE_PLATFORM（仅该镜像生效）"
                    ;;
                  *)
                    echo "❌ 行内 --platform 后面缺少镜像名，已跳过：$line"
                    continue
                    ;;
                esac
                ;;
              -*)
                echo "❌ 这一行看起来是命令行参数，镜像列表里只写镜像名，已跳过：$line"
                continue
                ;;
              *[[:space:]]*)
                echo "❌ 镜像名里含空格，不是合法的镜像引用，已跳过：$line"
                echo "   镜像列表每行只写一个镜像名；架构请填在 platform 参数或页面 ?arch= 里"
                continue
                ;;
            esac
            echo "========================================"
            echo "Processing: $image"

            # 引用可能是 repo:tag@sha256:…（digest 优先），按 digest 保存会丢掉 tag，
            # 导入后就成了 <none>。所以规整出一个 tag 引用，save 时用它。
            TAG_REF="${image%%@*}"
            LAST_SEG="${TAG_REF##*/}"
            case "$LAST_SEG" in
              *:*) ;;
              *) TAG_REF="${TAG_REF}:latest" ;;
            esac
            # 文件名同样去掉 @digest 部分，避免文件名里塞 64 位哈希
            SAFE_NAME=$(printf '%s' "$TAG_REF" | tr '/' '_' | tr ':' '_')
            FINAL_NAME="${SAFE_NAME}"
            echo "Save reference: $TAG_REF"
            echo "File name: ${FINAL_NAME}.tar"

            if [ -n "$IMAGE_PLATFORM" ]; then
              echo "Pulling $image (platform $IMAGE_PLATFORM)..."
            else
              echo "Pulling $image (默认平台)..."
            fi
            if ! pull_image "$image" "$IMAGE_PLATFORM"; then
              echo "❌ Failed to pull $image, skipping..."
              continue
            fi

            # 保证镜像带 tag，否则 docker save 出来的 tar 里 RepoTags 为空
            IMAGE_ID=$(docker image inspect -f '{{.Id}}' "$image" 2>/dev/null || true)
            if [ -n "$IMAGE_ID" ]; then
              docker tag "$IMAGE_ID" "$TAG_REF" || true
            else
              echo "⚠️ 拿不到镜像 ID，直接按原引用保存"
              TAG_REF="$image"
            fi

            echo "Saving $TAG_REF (platform ${IMAGE_PLATFORM:-默认})..."
            if ! save_image "$TAG_REF" "$IMAGE_PLATFORM" "${FINAL_NAME}.tar"; then
              echo "docker save 失败，改用 skopeo 按架构直接归档..."
              if ! skopeo_archive "$image" "$IMAGE_PLATFORM" "$TAG_REF" "${FINAL_NAME}.tar"; then
                echo "❌ $image 归档失败，跳过"
                continue
              fi
            fi

            FILE_SIZE=$(stat -c%s "${FINAL_NAME}.tar")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            echo "File size: ${FILE_SIZE_MB} MB"

            if [ "$FILE_SIZE" -gt 943718400 ]; then
              echo "Splitting large file..."
              split -b 950m "${FINAL_NAME}.tar" "${FINAL_NAME}.part."
              rm -f "${FINAL_NAME}.tar"
            elif [ "$FORMAT" = "tar.gz" ]; then
              echo "Compressing ${FINAL_NAME}.tar..."
              gzip "${FINAL_NAME}.tar"
            else
              echo "Keeping raw ${FINAL_NAME}.tar (format=tar, 不压缩)"
            fi

            # 清理镜像节省空间
            docker rmi "$image" || true
            echo "========================================"
          done <<< "$IMAGES"

          echo "========================================"
          echo "Files generated:"
          ls -lah *.tar.gz *.tar *.part.* 2>/dev/null || echo "No files found"
          echo "========================================"

      - name: Delete old release
        run: |
          gh release delete ${{ env.RELEASE_TAG }} -y --repo ${{ github.repository }} || echo "No existing release"
          git push origin --delete ${{ env.RELEASE_TAG }} || echo "No remote tag"
        env:
          GH_TOKEN: ${{ secrets.JIANG_PAT_TOKEN }}

      - name: Create new release
        run: |
          gh release create ${{ env.RELEASE_TAG }} \
            --title "Docker Images Batch - $(date '+%Y-%m-%d %H:%M:%S')" \
            --notes "镜像列表:\n${{ inputs.images }}\n打包格式: $PACK_FORMAT\n架构: $TARGET_PLATFORM" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.JIANG_PAT_TOKEN }}

      - name: Upload artifacts
        run: |
          files_uploaded=0
          for file in *.tar.gz *.tar *.part.*; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload ${{ env.RELEASE_TAG }} "$file" \
                --repo ${{ github.repository }} \
                --clobber
              files_uploaded=$((files_uploaded + 1))
            fi
          done

          if [ $files_uploaded -eq 0 ]; then
            echo "❌ No files were uploaded! Check if any images were successfully pulled."
            exit 1
          fi

          echo "✅ Successfully uploaded $files_uploaded files"
        env:
          GH_TOKEN: ${{ secrets.JIANG_PAT_TOKEN }}
