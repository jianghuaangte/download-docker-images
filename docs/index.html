<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Docker 镜像批量下载器 | 支持大文件分割</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  
  body, .glass-card, .task-item, button, a, input, textarea, .status-badge {

  .panel-header {
    background: rgba(255, 255, 255, 0.5);
    border-bottom: 1px solid #e5e7eb;
  }
  
  .light-text-primary { color: #1f2937; }
  .light-text-secondary { color: #374151; }
  .light-text-muted { color: #6b7280; }
  .light-text-light { color: #9ca3af; }
  .light-border { border-color: #e5e7eb; }
  .light-bg-gray { background-color: #f3f4f6; }
  .light-bg-gray-hover:hover { background-color: #e5e7eb; }
  .light-badge-gray { background-color: #f3f4f6; color: #4b5563; }
  .light-badge-green { background-color: #d1fae5; color: #047857; }
  .light-badge-red { background-color: #fee2e2; color: #b91c1c; }
  .light-badge-amber { background-color: #fef3c7; color: #b45309; }
  .light-badge-emerald { background-color: #d1fae5; color: #047857; }
  .light-btn-indigo { background-color: #eef2ff; color: #4338ca; }
  .light-btn-indigo:hover { background-color: #e0e7ff; }
  .light-btn-download { background-color: #d1fae5; color: #047857; }
  .light-btn-download:hover { background-color: #a7f3d0; }
  .light-btn-copy { background-color: #f3f4f6; color: #374151; }
  .light-btn-copy:hover { background-color: #e5e7eb; }
  
  body.dark {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    background-attachment: fixed;
  }
  
  body.dark .glass-card {
    background: rgba(30, 41, 59, 0.96);
    border: 1px solid rgba(71, 85, 105, 0.5);
    box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.3);
  }
  
  body.dark .task-item {
    background-color: #1e293b;
    border-color: #334155;
    border-left-color: #34d399;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  body.dark .task-item:hover {
    background-color: #2d3a4e;
  }
  
  body.dark input, body.dark textarea {
    background-color: #0f172a;
    border-color: #475569;
    color: #e2e8f0;
  }
  body.dark input:focus, body.dark textarea:focus {
    border-color: #10b981;
    outline: none;
  }

  body.dark select {
    background-color: #0f172a;
    border-color: #475569;
    color: #e2e8f0;
  }
  body.dark select:focus {
    border-color: #10b981;
    outline: none;
  }
  body.dark select option {
    background-color: #0f172a;

  }

  
  body.dark .scrollbar-custom::-webkit-scrollbar-track { background: #1e293b; }
  body.dark .scrollbar-custom::-webkit-scrollbar-thumb { background: #475569; }
  body.dark .panel-header {
    background: rgba(30, 41, 59, 0.8);
    border-bottom: 1px solid #334155;
  }
  
  body.dark .dark-text-primary { color: #f1f5f9; }
  body.dark .dark-text-secondary { color: #e2e8f0; }
  body.dark .dark-text-muted { color: #94a3b8; }
  body.dark .dark-text-light { color: #64748b; }
  body.dark .dark-border { border-color: #334155; }
  body.dark .dark-bg-gray { background-color: #334155; }
  body.dark .dark-bg-gray-hover:hover { background-color: #475569; }
  body.dark .dark-badge-gray { background-color: #334155; color: #cbd5e1; }
  body.dark .dark-badge-green { background-color: #065f46; color: #6ee7b7; }
  body.dark .dark-badge-red { background-color: #7f1d1d; color: #fca5a5; }
  body.dark .dark-badge-amber { background-color: #78350f; color: #fcd34d; }
  body.dark .dark-badge-emerald { background-color: #065f46; color: #6ee7b7; }
  body.dark .dark-btn-indigo { background-color: #312e81; color: #a5b4fc; }
  body.dark .dark-btn-indigo:hover { background-color: #4338ca; }
  body.dark .dark-btn-download { background-color: #065f46; color: #6ee7b7; }
  body.dark .dark-btn-download:hover { background-color: #047857; }
  body.dark .dark-btn-copy { background-color: #334155; color: #cbd5e1; }
  body.dark .dark-btn-copy:hover { background-color: #475569; }
  
  .theme-toggle-btn {
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);

  }
  .theme-toggle-btn:hover { transform: scale(1.05); }
  
  body .theme-toggle-btn {
    background: rgba(255, 255, 255, 0.85);

  }

<body class="min-h-screen flex items-center justify-center p-5 relative">

<div class="fixed top-5 right-5 z-50">
  <button id="themeToggle" class="theme-toggle-btn">
    <i id="themeIcon" class="fas fa-moon text-xl"></i>
  </button>
</div>

<div class="max-w-6xl w-full mx-auto grid grid-cols-1 lg:grid-cols-2 gap-7">

  <div class="glass-card rounded-2xl shadow-xl p-7 flex flex-col gap-6">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center bg-gradient-to-br from-emerald-500 to-teal-600 p-2.5 rounded-2xl shadow-md">
        <i class="fab fa-docker text-3xl text-white"></i>
      </div>
      <h1 class="text-3xl font-bold tracking-tight light-text-primary dark-text-primary">批量镜像下载器</h1>
      <p class="text-sm light-text-muted dark-text-muted">批量触发 · 自动分割大文件 · 智能检测下载</p>
    </div>

    <form id="dockerForm" class="flex flex-col gap-5">
      <div>
        <label class="block font-semibold mb-1.5 flex items-center gap-2 light-text-secondary dark-text-secondary">
          <i class="fas fa-list-ul text-emerald-600 text-sm"></i>
          <span>镜像名称 (每行一个)</span>
          <span class="text-xs text-red-400 ml-1">*</span>
        </label>
        <textarea id="imageList" placeholder="例如:&#10;nginx:latest&#10;linuxserver/obsidian:latest&#10;mysql:8.0"
          class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 transition font-mono text-sm"
          rows="8" required></textarea>
        <p class="text-xs mt-1 light-text-light dark-text-light"><i class="fas fa-info-circle"></i> 大镜像(&gt;900MB)会自动分割成多个文件</p>
      </div>

      <div>
        <label class="block font-semibold mb-1.5 flex items-center gap-2 light-text-secondary dark-text-secondary">
          <i class="fas fa-file-archive text-purple-500 text-sm"></i>
          <span>打包格式</span>
        </label>
        <div class="relative">
          <select id="packFormat" class="appearance-none w-full border rounded-xl px-4 py-3 pr-10 focus:ring-2 focus:ring-emerald-400 transition font-mono text-sm cursor-pointer">
            <option value="tar" selected>tar</option>
            <option value="tar.gz">tar.gz</option>
          </select>
          <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-xs pointer-events-none light-text-light dark-text-light"></i>
        </div>
      </div>

      <div>
        <label class="block font-semibold mb-1.5 flex items-center gap-2 light-text-secondary dark-text-secondary">
          <i class="fas fa-microchip text-sky-500 text-sm"></i>
          <span>架构</span>
        </label>
        <div class="relative">
          <select id="targetPlatform" class="appearance-none w-full border rounded-xl px-4 py-3 pr-10 focus:ring-2 focus:ring-emerald-400 transition font-mono text-sm cursor-pointer">
            <option value="auto" selected>auto</option>
            <option value="linux/arm64">arm64</option>
            <option value="linux/amd64">amd64</option>
            <option value="linux/arm/v7">arm/v7</option>
          </select>
          <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-xs pointer-events-none light-text-light dark-text-light"></i>
        </div>
      </div>

      <div>
        <label class="block font-semibold mb-1.5 flex items-center gap-2 light-text-secondary dark-text-secondary">
          <i class="fas fa-key text-amber-600 text-sm"></i>
          <span>授权码</span>
          <span class="text-xs text-red-400 ml-1">*</span>
        </label>
        <div class="relative">
          <input type="password" id="apiKey" placeholder="请输入授权码" class="w-full border rounded-xl px-4 py-3 pr-10 focus:ring-2 focus:ring-emerald-400 transition" required>
          <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 light-text-light dark-text-light text-sm"></i>
        </div>
      </div>

      <div>
        <label class="block font-semibold mb-1.5 flex items-center gap-2 light-text-secondary dark-text-secondary">
          <i class="fab fa-github text-slate-700 dark:text-slate-300 text-sm"></i>
          <span>GitHub Token</span>
          <span class="text-xs font-normal light-text-light dark-text-light">（可选 · 下载 ghcr.io 私有镜像）</span>
        </label>
        <div class="relative">
          <input type="password" id="ghcrToken" placeholder="ghp_xxxxxxxx 或 github_pat_xxxxxxxx" autocomplete="off" spellcheck="false"
            class="w-full border rounded-xl px-4 py-3 pr-10 focus:ring-2 focus:ring-emerald-400 transition font-mono text-sm">
          <i id="toggleToken" class="fas fa-eye absolute right-4 top-1/2 -translate-y-1/2 light-text-light dark-text-light text-sm cursor-pointer"></i>
        </div>
        <p class="text-xs mt-1 light-text-light dark-text-light">
          <i class="fas fa-info-circle"></i> 需要 <code>repo</code>、<code>workflow</code>、<code>read:packages</code> 权限；仅在本浏览器内使用，直接调用 GitHub API 触发，不会经过加速服务
        </p>
      </div>

      <div>
        <label class="block font-semibold mb-1.5 flex items-center gap-2 light-text-secondary dark-text-secondary">
          <i class="fas fa-tachometer-alt text-blue-500 text-sm"></i>
          <span>GitHub 加速地址</span>
        </label>
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <input type="text" id="mirrorPrefix" value="https://ghfast.top" class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400 transition">
          </div>
          <button type="button" id="resetMirror" class="px-3 py-2 rounded-xl text-sm font-medium light-bg-gray dark-bg-gray light-text-secondary dark-text-secondary light-bg-gray-hover dark-bg-gray-hover">
            <i class="fas fa-undo-alt"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="mt-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 btn-hover-scale">
        <i class="fas fa-cloud-download-alt"></i>
        <span>批量触发下载任务</span>
      </button>
    </form>
  </div>

  <div class="glass-card rounded-2xl shadow-xl flex flex-col h-full overflow-hidden">
    <div class="panel-header p-5">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <h2 class="text-xl font-bold flex items-center gap-2 light-text-secondary dark-text-secondary">
          <i class="fas fa-tasks text-emerald-600"></i>
          <span>镜像任务状态</span>
        </h2>
        <div class="flex gap-2">
          <button id="refreshReleaseBtn" class="text-xs transition flex items-center gap-1 px-3 py-1.5 rounded-full light-btn-indigo dark-btn-indigo">
            <i class="fas fa-sync-alt"></i> 刷新列表
          </button>
          <button id="clearAllStatus" class="text-xs transition flex items-center gap-1 px-3 py-1.5 rounded-full light-bg-gray dark-bg-gray light-text-muted dark-text-muted light-bg-gray-hover dark-bg-gray-hover">
            <i class="fas fa-trash-alt"></i> 清空
          </button>
        </div>
      </div>
    </div>
    <div id="statusPanel" class="flex-1 p-4 space-y-3 overflow-y-auto max-h-[60vh] scrollbar-custom">
      <div class="flex flex-col items-center justify-center py-10 light-text-light dark-text-light">
        <i class="fas fa-inbox text-5xl mb-3 opacity-40"></i>
        <p class="text-sm">暂无镜像任务</p>
        <p class="text-xs mt-1">输入镜像并点击批量触发</p>
      </div>
    </div>
  </div>
</div>

<script>
// 主题切换
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const getPreferredTheme = () => localStorage.getItem('theme') || 'light';
let currentTheme = getPreferredTheme();

function applyTheme(theme) {
  if (theme === 'dark') {
    document.body.classList.add('dark');
    themeIcon.className = 'fas fa-sun text-xl';
  } else {
    document.body.classList.remove('dark');
    themeIcon.className = 'fas fa-moon text-xl';
  }
  localStorage.setItem('theme', theme);
}
applyTheme(currentTheme);
themeToggle.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(currentTheme);
});

// 配置
const WORKER_URL = 'https://docker.myfiles.ccwu.cc';
const GITHUB_API = 'https://api.github.com';
const GITHUB_REPO = 'jianghuaangte/download-docker-images';
const PRIVATE_GITHUB_REPO = 'jianghuaangte/private-download-docker-images';
const WORKFLOW_FILE = 'batch-pull-docker.yml';
const PRIVATE_WORKFLOW_FILE = 'batch-pull-private-docker.yml';
const RELEASE_TAG = 'docker-images-batch';
const DEFAULT_PACK_FORMAT = 'tar';
const PACK_FORMAT_STORAGE_KEY = 'dockerPackFormat';
const PLATFORM_STORAGE_KEY = 'dockerTargetPlatform';

function getActiveRepo() {
  return ghcrTokenInput.value.trim() ? PRIVATE_GITHUB_REPO : GITHUB_REPO;
}

function getReleaseApiUrl() {
  return `${GITHUB_API}/repos/${getActiveRepo()}/releases/tags/${RELEASE_TAG}`;
}

function getReleaseDownloadUrl() {
  return `https://github.com/${getActiveRepo()}/releases/download/${RELEASE_TAG}`;
}

const form = document.getElementById('dockerForm');
const imageListTextarea = document.getElementById('imageList');
const apiKeyInput = document.getElementById('apiKey');
const ghcrTokenInput = document.getElementById('ghcrToken');
const mirrorPrefixInput = document.getElementById('mirrorPrefix');
const resetMirrorBtn = document.getElementById('resetMirror');
const statusPanel = document.getElementById('statusPanel');
const clearAllStatusBtn = document.getElementById('clearAllStatus');
const refreshReleaseBtn = document.getElementById('refreshReleaseBtn');
const packFormatInput = document.getElementById('packFormat');

// 打包格式，只接受工作流声明过的两种取值；默认 tar
function getPackFormat() {
  const v = packFormatInput ? packFormatInput.value : DEFAULT_PACK_FORMAT;
  return v === 'tar.gz' ? 'tar.gz' : DEFAULT_PACK_FORMAT;
}

// 记住上次选择
try {
  const savedFormat = localStorage.getItem(PACK_FORMAT_STORAGE_KEY);
  if (packFormatInput && (savedFormat === 'tar' || savedFormat === 'tar.gz')) {
    packFormatInput.value = savedFormat;
  }
} catch (e) {}

if (packFormatInput) {
  packFormatInput.addEventListener('change', () => {
    try { localStorage.setItem(PACK_FORMAT_STORAGE_KEY, getPackFormat()); } catch (e) {}
    refreshAllTasks();
  });
}

const ALLOWED_PLATFORMS = ['linux/amd64', 'linux/arm64', 'linux/arm/v7'];
const platformInput = document.getElementById('targetPlatform');

// 目标架构；auto 表示工作流按镜像名猜（名字里没写架构就是 amd64）
function getTargetPlatform() {
  const v = platformInput ? platformInput.value : 'auto';
  return ALLOWED_PLATFORMS.indexOf(v) >= 0 ? v : 'auto';
}

try {
  const savedPlatform = localStorage.getItem(PLATFORM_STORAGE_KEY);
  if (platformInput && (savedPlatform === 'auto' || ALLOWED_PLATFORMS.indexOf(savedPlatform) >= 0)) {
    platformInput.value = savedPlatform;
  }
} catch (e) {}

if (platformInput) {
  platformInput.addEventListener('change', () => {
    try { localStorage.setItem(PLATFORM_STORAGE_KEY, getTargetPlatform()); } catch (e) {}
  });
}

let statusRowsMap = new Map();
let releaseAssets = [];

// 获取加速后的下载链接
function getAcceleratedUrl(path) {
  let mirror = mirrorPrefixInput.value.trim();
  if (!mirror) return `${getReleaseDownloadUrl()}/${path}`;
  mirror = mirror.replace(/\/+$/, '');
  return `${mirror}${getReleaseDownloadUrl()}/${path}`;
}

// 获取 Release 文件列表
async function fetchReleaseAssets() {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    const headers = { 'Accept': 'application/vnd.github+json' };
    const token = ghcrTokenInput.value.trim();
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const response = await fetch(getReleaseApiUrl(), {
      headers: headers,
      signal: controller.signal,
      cache: 'no-store'
    });
    clearTimeout(timeoutId);
    
    if (!response.ok) return [];
    const release = await response.json();
    releaseAssets = release.assets || [];
    return releaseAssets;
  } catch (err) {
    console.error('fetchReleaseAssets error:', err);
    return [];
  }
}

// 检查镜像是否完整（同时支持 .tar.gz 与 .tar 两种打包格式）
function checkImageComplete(imageName) {
  // 工作流按「去掉 @digest 后的 tag 引用」命名产物，这里必须用同一规则
  const safeName = imageName.split('@')[0].replace(/\//g, '_').replace(/:/g, '_');
  const relatedFiles = releaseAssets.filter(asset => asset.name.startsWith(safeName));

  if (relatedFiles.length === 0) {
    return { complete: false, files: [], size: 0, isSplit: false, safeName: safeName, packFormat: null, partFormat: null };
  }

  // 整包优先：.tar.gz 优先于 .tar（两者不会同时存在，Release 每次重建）
  for (const fmt of ['tar.gz', 'tar']) {
    const fileName = `${safeName}.${fmt}`;
    const file = relatedFiles.find(f => f.name === fileName);
    if (file) {
      return { complete: true, files: [file], size: file.size, isSplit: false, safeName: safeName, packFormat: fmt, partFormat: null };
    }
  }

  // 分片恒为未压缩 tar 的切片，合并后得到 .tar
  const partFiles = relatedFiles
    .filter(f => f.name.includes('.part.'))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  if (partFiles.length > 0) {
    const totalSize = partFiles.reduce((sum, f) => sum + f.size, 0);
    return { complete: true, files: partFiles, size: totalSize, isSplit: true, safeName: safeName, packFormat: null, partFormat: 'tar' };
  }

  return { complete: false, files: relatedFiles, size: 0, isSplit: false, safeName: safeName, packFormat: null, partFormat: null };
}

// 格式化文件大小
function formatSize(bytes) {
  if (!bytes) return '0 B';
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + sizes[i];
}

// 创建任务行
function createTaskRow(imageName, isPrivate) {
  const container = document.createElement('div');
  container.className = "task-item";
  container.dataset.image = imageName;
  
  const header = document.createElement('div');
  header.className = "flex items-center justify-between gap-2 flex-wrap mb-2";
  header.innerHTML = `
    <div class="flex items-center gap-2 flex-1 min-w-0">
      <i class="fab fa-docker text-emerald-500 text-sm flex-shrink-0"></i>
      <span class="font-mono text-sm font-semibold truncate light-text-primary dark-text-primary" title="${escapeHtml(imageName)}">${escapeHtml(imageName)}</span>
      ${isPrivate ? '<span class="text-xs text-amber-400 dark:text-amber-300">私有</span>' : ''}
    </div>
    <span class="status-badge text-xs px-2 py-1 rounded-full whitespace-nowrap light-badge-gray dark-badge-gray">⏳ 等待触发</span>
  `;
  
  const downloadSection = document.createElement('div');
  downloadSection.className = "mt-2";
  downloadSection.innerHTML = `
    <div class="file-list text-xs"></div>
    <div class="flex gap-2 mt-2">
      <button class="check-btn text-xs font-medium px-3 py-1.5 rounded-lg light-btn-indigo dark-btn-indigo"><i class="fas fa-search"></i> 检测文件</button>
      <button class="download-all-btn text-xs font-medium px-3 py-1.5 rounded-lg light-bg-gray dark-bg-gray light-text-muted dark-text-muted" disabled><i class="fas fa-download"></i> 下载全部</button>
    </div>
    <div class="info-msg text-xs mt-2 flex items-center gap-1 light-text-light dark-text-light"><i class="fas fa-info-circle"></i> 尚未触发任务</div>
  `;
  
  container.appendChild(header);
  container.appendChild(downloadSection);
  
  const statusBadge = header.querySelector('.status-badge');
  const checkBtn = downloadSection.querySelector('.check-btn');
  const downloadAllBtn = downloadSection.querySelector('.download-all-btn');
  const fileListDiv = downloadSection.querySelector('.file-list');
  const infoMsg = downloadSection.querySelector('.info-msg');
  
  return { container, statusBadge, checkBtn, downloadAllBtn, fileListDiv, infoMsg, imageName, isPrivate };
}

// 生成单个文件的下载 HTML：公开用加速链接，私有用带 Token 的按钮
function fileDownloadHtml(file, isPrivate) {
  if (!isPrivate) {
    const downloadUrl = getAcceleratedUrl(file.name);
    return `<a href="${downloadUrl}" data-dl download class="text-emerald-600 hover:text-emerald-700" target="_blank"><i class="fas fa-download"></i></a>`;
  }
  // 私有 Release 资产：assets 接口会 302 到 release-assets.githubusercontent.com，
  // 而对象存储不返回 Access-Control-Allow-Origin，浏览器 fetch 读不到字节。
  // 所以先用授权码让 Worker 把 302 解析成一次性签名地址（纯 token），
  // 失败再回退到 Release 下载地址（走浏览器登录会话）。
  return `<a href="${privateAssetUrl(file)}" data-dl target="_blank" rel="noopener" class="text-emerald-600 hover:text-emerald-700"><i class="fas fa-download"></i></a>`;
}

// 私有资产的 Release 下载地址（回退用，需要浏览器已登录有权限的 GitHub 账号）
function privateAssetUrl(file) {
  return `https://github.com/${PRIVATE_GITHUB_REPO}/releases/download/${RELEASE_TAG}/${encodeURIComponent(file.name)}`;
}

// 让 Worker 用 token 换资产的一次性签名地址；拿不到就返回 null
async function resolvePrivateAssetLocation(file) {
  const key = apiKeyInput.value.trim();
  if (!key) return null;
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, downloadAsset: { repo: 'private', id: file.id } })
    });
    const data = await res.json();
    if (data && data.success && data.location) return data.location;
    console.warn('签名地址获取失败:', data && data.message);
  } catch (err) {
    console.warn('签名地址获取异常:', err.message);
  }
  return null;
}

// 用隐藏 iframe 触发下载：跨域导航不受 CORS 限制，也不会被弹窗拦截
function triggerDownload(url) {
  const frame = document.createElement('iframe');
  frame.style.display = 'none';
  frame.src = url;
  document.body.appendChild(frame);
  setTimeout(() => frame.remove(), 120000);
}

// 更新任务显示
async function updateTaskDisplay(imageName) {
  const record = statusRowsMap.get(imageName);
  if (!record) return;
  
  const { fileListDiv, downloadAllBtn, infoMsg, statusBadge, isPrivate } = record;
  
  const { complete, files, size, isSplit, safeName, packFormat, partFormat } = checkImageComplete(imageName);
  
  if (!complete || files.length === 0) {
    fileListDiv.innerHTML = '<div class="text-muted">暂无可用文件</div>';
    downloadAllBtn.disabled = true;
    downloadAllBtn.className = "download-all-btn text-xs font-medium px-3 py-1.5 rounded-lg light-bg-gray dark-bg-gray light-text-muted dark-text-muted";
    downloadAllBtn.onclick = null;
    return;
  }
  
  let filesHtml = '';
  if (isSplit) {
    filesHtml = `<div class="mb-2 text-amber-600 dark:text-amber-400"><i class="fas fa-cut"></i> 镜像已分割为 ${files.length} 个分片（合并后为 ${safeName}.tar）:</div>`;
    files.forEach((file, idx) => {
      filesHtml += `
        <div class="file-item flex items-center justify-between gap-2 light-bg-gray dark-bg-gray p-1 rounded mb-1">
          <span class="truncate">📦 分片 ${String(idx + 1).padStart(2, '0')}: ${file.name}</span>
          <span class="text-muted text-xs">${formatSize(file.size)}</span>
          ${fileDownloadHtml(file, isPrivate)}
        </div>
      `;
    });
    // 优化后的命令显示 - 单行完整命令
    const mergeCmd = `cat ${safeName}.part.* > ${safeName}.tar`;
    const loadCmd = `docker load -i ${safeName}.tar`;
    filesHtml += `
      <div class="mt-3 p-2 light-bg-gray dark-bg-gray rounded text-xs">
        <div class="font-semibold mb-1"><i class="fas fa-terminal"></i> 导入步骤:</div>
        <div class="space-y-1">
          <div>1️⃣ 合并分片: <code class="block mt-1 p-1 bg-white dark:bg-gray-800 rounded">${mergeCmd}</code></div>
          <div>2️⃣ 加载镜像: <code class="block mt-1 p-1 bg-white dark:bg-gray-800 rounded">${loadCmd}</code></div>
        </div>
      </div>
    `;
  } else {
    const file = files[0];
    const isGz = file.name.endsWith('.tar.gz');
    const loadCmd = isGz 
      ? `gunzip ${file.name} && docker load -i ${file.name.replace('.gz', '')}`
      : `docker load -i ${file.name}`;
    filesHtml = `
      <div class="file-item flex items-center justify-between gap-2 light-bg-gray dark-bg-gray p-2 rounded">
        <span><i class="fas fa-file-archive"></i> ${file.name}</span>
        <span class="text-muted text-xs">${formatSize(file.size)}</span>
        ${fileDownloadHtml(file, isPrivate)}
      </div>
      <div class="mt-2 p-2 light-bg-gray dark-bg-gray rounded text-xs">
        <div><i class="fas fa-terminal"></i> 导入命令:</div>
        <code class="block mt-1 p-1 bg-white dark:bg-gray-800 rounded">${loadCmd}</code>
      </div>
    `;
  }
  
  fileListDiv.innerHTML = filesHtml;
  
  // 公开走加速链接；私有用 token 换签名地址，失败回退 Release 链接
  const resolveDownloadUrl = async (file) => {
    if (!isPrivate) return getAcceleratedUrl(file.name);
    const signed = await resolvePrivateAssetLocation(file);
    return signed || privateAssetUrl(file);
  };

  fileListDiv.querySelectorAll('a[data-dl]').forEach((a, idx) => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      resolveDownloadUrl(files[idx]).then(triggerDownload);
    });
  });

  if (files.length > 0) {
    downloadAllBtn.disabled = false;
    downloadAllBtn.className = "download-all-btn text-xs font-medium px-3 py-1.5 rounded-lg light-btn-download dark-btn-download";
    downloadAllBtn.onclick = async () => {
      for (let i = 0; i < files.length; i++) {
        triggerDownload(await resolveDownloadUrl(files[i]));
        await new Promise(r => setTimeout(r, 400));
      }
    };
  } else {
    downloadAllBtn.disabled = true;
    downloadAllBtn.className = "download-all-btn text-xs font-medium px-3 py-1.5 rounded-lg light-bg-gray dark-bg-gray light-text-muted dark-text-muted";
    downloadAllBtn.onclick = null;
  }
  
  const formatLabel = isSplit ? `${partFormat || 'tar'} 分片` : (packFormat || DEFAULT_PACK_FORMAT);
  infoMsg.innerHTML = `<i class="fas fa-check-circle text-green-500"></i> 已就绪，共 ${files.length} 个文件，总计 ${formatSize(size)} · ${formatLabel}`;
  statusBadge.innerText = "✅ 可下载";
  statusBadge.className = "status-badge text-xs px-2 py-1 rounded-full whitespace-nowrap light-badge-emerald dark-badge-emerald";
}

// 检测镜像
async function performCheck(imageName, forceRefresh = false) {
  const record = statusRowsMap.get(imageName);
  if (!record) return;
  
  const { checkBtn, infoMsg, statusBadge } = record;
  
  if (forceRefresh) {
    await fetchReleaseAssets();
  }
  
  checkBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 检测中';
  checkBtn.disabled = true;
  infoMsg.innerHTML = '<i class="fas fa-hourglass-half"></i> 正在检测文件...';
  
  try {
    await updateTaskDisplay(imageName);
    infoMsg.innerHTML = '<i class="fas fa-check-circle text-green-500"></i> 检测完成';
  } catch (err) {
    infoMsg.innerHTML = `<i class="fas fa-bug text-red-500"></i> 检测异常: ${err.message}`;
  } finally {
    checkBtn.innerHTML = '<i class="fas fa-search"></i> 检测文件';
    checkBtn.disabled = false;
  }
}

// 调用 GitHub REST API
async function ghApi(path, options = {}) {
  const headers = {
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Authorization': `Bearer ${ghcrTokenInput.value.trim()}`
  };
  if (options.body) headers['Content-Type'] = 'application/json';
  const res = await fetch(GITHUB_API + path, {
    method: options.method || 'GET',
    headers,
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  let data = null;
  if (res.status !== 204) {
    try { data = await res.json(); } catch (e) { data = null; }
  }
  return { ok: res.ok, status: res.status, data };
}

// 先由 Worker 验证授权码，验证通过后再使用 Token 直连 GitHub 触发私有工作流
async function validateWorkerAuthorization(apiKey) {
  let response;
  try {
    response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: apiKey, validateOnly: true })
    });
  } catch (err) {
    throw new Error('无法连接授权服务，请检查网络');
  }
  let result = null;
  try { result = await response.json(); } catch (e) { result = null; }
  if (!result) {
    throw new Error(`授权服务不支持校验模式（HTTP ${response.status}），需要为 Worker 增加 validateOnly 支持`);
  }
  if (!response.ok || !result.success) {
    throw new Error(result.message || '授权码验证失败');
  }
}

// 直接用 GitHub Token 触发私有工作流
async function triggerByGitHubApi(images, token, format, platform) {
  const me = await ghApi('/user');
  if (!me.ok) {
    if (me.status === 401) throw new Error('Token 无效或已过期');
    throw new Error(`Token 校验失败（HTTP ${me.status}）`);
  }

  const repoInfo = await ghApi(`/repos/${PRIVATE_GITHUB_REPO}`);
  if (!repoInfo.ok) {
    throw new Error(`无法访问私有仓库，HTTP ${repoInfo.status}`);
  }

  const ref = (repoInfo.data && repoInfo.data.default_branch) || 'main';
  const res = await ghApi(`/repos/${PRIVATE_GITHUB_REPO}/actions/workflows/${PRIVATE_WORKFLOW_FILE}/dispatches`, {
    method: 'POST',
    body: {
      ref,
      inputs: {
        images: images.join('\n'),
        ghcr_username: me.data.login,
        format: format,
        platform: platform
      }
    }
  });

  if (res.status === 204 || res.ok) return { login: me.data.login };
  if (res.status === 403) throw new Error('Token 权限不足，需要 repo、workflow 权限');
  if (res.status === 404) throw new Error('私有工作流不存在或 Token 无权访问该仓库');
  throw new Error((res.data && res.data.message) || `GitHub 返回 ${res.status}`);
}

// 触发批量构建
async function triggerBatchImages(images, apiKey, token, format, platform) {
  for (const img of images) {
    if (!statusRowsMap.has(img)) {
      const task = createTaskRow(img, !!token);
      statusPanel.appendChild(task.container);
      statusRowsMap.set(img, task);
    }
    const record = statusRowsMap.get(img);
    record.statusBadge.innerText = "⏳ 触发中...";
    record.statusBadge.className = "status-badge text-xs px-2 py-1 rounded-full whitespace-nowrap light-badge-amber dark-badge-amber";
    record.infoMsg.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 正在触发 GitHub Actions...';
    record.checkBtn.onclick = () => performCheck(img, true);
  }
  
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 触发中...';
  submitBtn.disabled = true;
  
  try {
    let success = false;
    let failMessage = '';
    let successNote = '已触发，等待构建完成（约5-15分钟）';

    if (token) {
      await validateWorkerAuthorization(apiKey);
      const info = await triggerByGitHubApi(images, token, format, platform);
      success = true;
      successNote = `已通过 GitHub API 触发（${escapeHtml(info.login)} · ${format} · ${platform}），等待构建完成（约5-15分钟）`;
    } else {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ images, key: apiKey, format, platform })
      });
      const result = await response.json();
      success = !!result.success;
      failMessage = result.message;
      // 新 Worker 会在响应里回带实际转发的 format；没有这个字段说明还是老版本
      if (success && result.format !== format && format !== DEFAULT_PACK_FORMAT) {
        successNote = `⚠️ Worker 未回带格式确认，可能仍按默认 ${DEFAULT_PACK_FORMAT} 打包；要出 ${format} 需要重新部署 Worker`;
      }
    }

    if (success) {
      for (const img of images) {
        const record = statusRowsMap.get(img);
        record.statusBadge.innerText = "✅ 已触发";
        record.statusBadge.className = "status-badge text-xs px-2 py-1 rounded-full whitespace-nowrap light-badge-green dark-badge-green";
        record.infoMsg.innerHTML = `<i class="fas fa-check-circle text-green-500"></i> ${successNote}`;
        record.checkBtn.disabled = false;
      }
      
      setTimeout(async () => {
        await fetchReleaseAssets();
        for (const img of images) {
          if (statusRowsMap.has(img)) await updateTaskDisplay(img);
        }
      }, 30000);
    } else {
      for (const img of images) {
        const record = statusRowsMap.get(img);
        record.statusBadge.innerText = "❌ 触发失败";
        record.statusBadge.className = "status-badge text-xs px-2 py-1 rounded-full whitespace-nowrap light-badge-red dark-badge-red";
        record.infoMsg.innerHTML = `<i class="fas fa-exclamation-triangle text-red-500"></i> 触发失败: ${escapeHtml(failMessage || '未知错误')}`;
      }
      alert(`触发失败: ${failMessage || '未知错误'}`);
    }
  } catch (err) {
    for (const img of images) {
      const record = statusRowsMap.get(img);
      record.statusBadge.innerText = "❌ 触发失败";
      record.statusBadge.className = "status-badge text-xs px-2 py-1 rounded-full whitespace-nowrap light-badge-red dark-badge-red";
      record.infoMsg.innerHTML = `<i class="fas fa-exclamation-triangle text-red-500"></i> 触发失败: ${escapeHtml(err.message)}`;
    }
  } finally {
    submitBtn.innerHTML = '<i class="fas fa-cloud-download-alt"></i> 批量触发下载任务';
    submitBtn.disabled = false;
  }
}

// 刷新所有任务
async function refreshAllTasks() {
  await fetchReleaseAssets();
  for (const [img, record] of statusRowsMap.entries()) {
    await updateTaskDisplay(img);
  }
}

refreshReleaseBtn.onclick = async () => {

  await refreshAllTasks();
  refreshReleaseBtn.innerHTML = '<i class="fas fa-sync-alt"></i> 刷新列表';

};

form.onsubmit = async (e) => {
  e.preventDefault();
  const rawImages = imageListTextarea.value.trim();
  if (!rawImages) return alert('请输入至少一个镜像');
  // 以 # 开头的行当注释忽略（与工作流里的清理逻辑一致）
  const images = rawImages.split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));
  const apiKey = apiKeyInput.value.trim();
  const token = ghcrTokenInput.value.trim();
  const format = getPackFormat();
  const platform = getTargetPlatform();
  if (!apiKey) return alert('请输入授权码');
  
  if (statusPanel.querySelector('.flex.flex-col.items-center.justify-center.py-10')) {
    statusPanel.innerHTML = '';
  }
  
  await triggerBatchImages(images, apiKey, token, format, platform);
};

// 显示 / 隐藏 Token
document.getElementById('toggleToken').onclick = () => {
  const icon = document.getElementById('toggleToken');
  const hidden = ghcrTokenInput.type === 'password';
  ghcrTokenInput.type = hidden ? 'text' : 'password';
  icon.className = hidden
    ? 'fas fa-eye-slash absolute right-4 top-1/2 -translate-y-1/2 light-text-light dark-text-light text-sm cursor-pointer'
    : 'fas fa-eye absolute right-4 top-1/2 -translate-y-1/2 light-text-light dark-text-light text-sm cursor-pointer';
};

function escapeHtml(str) {
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}
